<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlayBank v10: Executive</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00f2ea; --accent: #00ff87; --bg: #050505; --surface: #111; 
            --glass: rgba(255, 255, 255, 0.05); --red: #ff3e3e; transition: 0.5s; 
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 430px; min-height: 100vh; padding: 24px; box-sizing: border-box; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Goal & Balance Card */
        .card { background: var(--surface); border-radius: 28px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--glass); }
        .track { width: 100%; height: 40px; background: #222; border-radius: 20px; margin-top: 15px; position: relative; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box; overflow: hidden; }
        .runner { font-size: 1.6rem; position: absolute; left: 10px; transition: 1s; z-index: 5; }
        .bar-fill { height: 8px; background: linear-gradient(to right, var(--primary), var(--accent)); border-radius: 10px; width: 0%; transition: 1s ease; opacity: 0.8; }
        .balance { font-size: 2.3rem; font-weight: 800; color: white; margin: 10px 0; letter-spacing: -1px; }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item { background: var(--surface); padding: 20px; border-radius: 25px; border: 1px solid var(--glass); text-align: center; cursor: pointer; }
        
        /* Modal & Report */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; padding: 25px; z-index: 1000; box-sizing: border-box; overflow-y: auto; }
        .btn { background: linear-gradient(to right, var(--primary), var(--accent)); color: #000; border: none; padding: 18px; border-radius: 18px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 0.9rem; }
        .btn-outline { background: transparent; color: white; border: 1px solid var(--glass); padding: 15px; border-radius: 15px; width: 100%; margin-top: 10px; cursor: pointer; font-size: 0.8rem; }
        
        #chartContainer { width: 220px; height: 220px; margin: 20px auto; }
        .pdf-content { background: #000; padding: 10px; }
    </style>
</head>
<body>

<div class="app">
    <div id="homeView" class="view active">
        <div style="margin-bottom: 25px;">
            <small style="opacity: 0.5;">Halo, Tondini!</small>
            <h2 style="margin: 0;">Slay Your Money! 💎</h2>
        </div>

        <div class="card" style="border-color: rgba(0, 242, 234, 0.2);">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600;">
                <span onclick="editGoal()" style="border-bottom: 1px dashed var(--primary); cursor:pointer;">🎯 <span id="goalName">Set Target</span></span>
                <span id="goalPercent" style="color: var(--primary);">0%</span>
            </div>
            <div class="track">
                <span class="runner" id="runnerPawn">🚶‍♂️</span>
                <div id="progressBar" class="bar-fill"></div>
            </div>
        </div>

        <div class="card" style="text-align: center;" id="balanceCard">
            <small style="opacity: 0.5; letter-spacing: 1px;">TOTAL SALDO</small>
            <div class="balance" id="totalBalance" onclick="adjustBalance()">Rp 0</div>
            <div id="aiNote" style="font-size: 0.8rem; opacity: 0.6; margin-top: 10px;">🤖 Data lo tersimpan aman di HP ini.</div>
        </div>

        <div class="grid">
            <div class="item" onclick="go('in')">💰<br><b style="display:block; margin-top:8px;">Cuan</b></div>
            <div class="item" onclick="go('out')">💸<br><b style="display:block; margin-top:8px;">Bocor</b></div>
            <div class="item" style="grid-column: span 2; border-color: var(--primary);" onclick="showReport()">
                <b>📊 LIHAT LAPORAN DETAIL</b>
            </div>
            <div class="item" style="grid-column: span 2; opacity: 0.2; font-size: 0.7rem; padding: 10px;" onclick="resetAll()">RESET DATA</div>
        </div>
    </div>

    <div id="actionView" class="view">
        <div onclick="back()" style="cursor:pointer; margin-bottom: 25px; opacity:0.6;">← Kembali</div>
        <h2 id="actionTitle">Input</h2>
        <input type="number" id="valInput" style="width: 100%; background: #000; border: 2px solid #222; padding: 20px; border-radius: 18px; color: white; margin-bottom: 20px; font-size: 1.5rem; text-align: center;" placeholder="0">
        <div id="catBox" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        <button class="btn" onclick="save()">SIMPAN ✨</button>
    </div>
</div>

<div id="reportOverlay" class="overlay">
    <div id="reportToPrint" class="pdf-content">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="margin:0;">Laporan SlayBank 🏆</h2>
            <small style="opacity:0.6;" id="reportDate"></small>
        </div>

        <div id="chartContainer"><canvas id="myChart"></canvas></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
            <div class="card" style="margin:0; text-align:center;"><small>Pemasukan</small><br><b style="color:var(--accent)" id="inText">Rp 0</b></div>
            <div class="card" style="margin:0; text-align:center;"><small>Pengeluaran</small><br><b style="color:var(--red)" id="outText">Rp 0</b></div>
        </div>

        <div class="card" style="margin-top: 15px;">
            <small style="opacity:0.6;">Progres Goal: <b id="goalLabelText"></b></small><br>
            <b id="goalValText">Rp 0 / Rp 0</b>
        </div>
    </div>

    <button class="btn" onclick="copyWA()">Salin Laporan (WhatsApp) 📱</button>
    <button class="btn-outline" onclick="downloadPDF()">Unduh Laporan PDF 📄</button>
    <button class="btn-outline" style="border:none; color:var(--red);" onclick="document.getElementById('reportOverlay').style.display='none'">Tutup</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('slaybank_v10')) || {
        balance: 0, saved: 0, target: 0, targetLabel: "Target Belanja",
        logs: { in: 0, out: 0 }, catData: {}
    };

    function sync() { localStorage.setItem('slaybank_v10', JSON.stringify(db)); render(); }

    function render() {
        document.getElementById('totalBalance').innerText = "Rp " + db.balance.toLocaleString('id-ID');
        document.getElementById('goalName').innerText = db.targetLabel;
        let p = db.target > 0 ? Math.min((db.saved / db.target) * 100, 100) : 0;
        document.getElementById('goalPercent').innerText = p.toFixed(1) + "%";
        document.getElementById('progressBar').style.width = p + "%";
        const runner = document.getElementById('runnerPawn');
        const tw = document.querySelector('.track').offsetWidth - 50;
        runner.style.left = (10 + (tw * (p / 100))) + "px";
    }

    function editGoal() {
        let n = prompt("Nabung buat apa?", db.targetLabel);
        let v = prompt("Nominal target?", db.target);
        if (n && v) { db.targetLabel = n; db.target = parseInt(v); sync(); }
    }

    function adjustBalance() {
        let v = prompt("Set saldo total:", db.balance);
        if (v) { db.balance = parseInt(v); sync(); }
    }

    let mode = 'in'; let selCat = '';
    const cats = {
        in: ['Gaji', 'Bonus', 'Side Hustle', '⭐ Tabungan Goal'],
        out: ['Makan', 'Kopi', 'Bensin', 'Belanja', 'Zakat/Donasi']
    };

    function go(m) {
        mode = m; selCat = '';
        document.getElementById('homeView').classList.remove('active');
        document.getElementById('actionView').classList.add('active');
        document.getElementById('actionTitle').innerText = m === 'in' ? 'Cuan Masuk' : 'Bocor Alus';
        const box = document.getElementById('catBox'); box.innerHTML = '';
        cats[m].forEach(c => {
            const d = document.createElement('div');
            d.style.padding = "18px"; d.style.background = "var(--surface)"; d.style.borderRadius = "15px"; d.style.textAlign = "center"; d.style.border = "1px solid var(--glass)";
            d.innerText = c; d.onclick = () => { selCat = c; Array.from(box.children).forEach(x => x.style.borderColor="var(--glass)"); d.style.borderColor="var(--primary)"; };
            box.appendChild(d);
        });
    }

    function back() { document.getElementById('homeView').classList.add('active'); document.getElementById('actionView').classList.remove('active'); }

    function save() {
        let v = parseInt(document.getElementById('valInput').value);
        if (!v || !selCat) return alert("Isi data!");
        if (mode === 'in') {
            db.balance += v; db.logs.in += v;
            if (selCat === '⭐ Tabungan Goal') {
                db.saved += v;
                if (db.saved >= db.target) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
        } else {
            db.balance -= v; db.logs.out += v;
            db.catData[selCat] = (db.catData[selCat] || 0) + v;
            if (confirm("Potong tabungan " + db.targetLabel + "?")) db.saved -= v;
        }
        document.getElementById('valInput').value = ''; sync(); back();
    }

    let myChart = null;
    function showReport() {
        document.getElementById('reportOverlay').style.display = 'flex';
        document.getElementById('reportDate').innerText = new Date().toLocaleDateString('id-ID', { dateStyle: 'long' });
        document.getElementById('inText').innerText = "Rp " + db.logs.in.toLocaleString();
        document.getElementById('outText').innerText = "Rp " + db.logs.out.toLocaleString();
        document.getElementById('goalLabelText').innerText = db.targetLabel;
        document.getElementById('goalValText').innerText = `Rp ${db.saved.toLocaleString()} / Rp ${db.target.toLocaleString()}`;

        const ctx = document.getElementById('myChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Cuan', 'Bocor'],
                datasets: [{
                    data: [db.logs.in, db.logs.out],
                    backgroundColor: ['#00ff87', '#ff3e3e'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: { plugins: { legend: { display: false } }, cutout: '70%' }
        });
    }

    function copyWA() {
        const text = `🏆 LAPORAN SLAYBANK - ${db.targetLabel}\n--------------------------\n💰 Cuan: Rp ${db.logs.in.toLocaleString()}\n💸 Bocor: Rp ${db.logs.out.toLocaleString()}\n💎 Sisa Saldo: Rp ${db.balance.toLocaleString()}\n🎯 Progress: ${((db.saved/db.target)*100).toFixed(1)}%\n--------------------------\nDikirim via SlayBank AI 🤖`;
        navigator.clipboard.writeText(text);
        alert("Laporan disalin! Silakan paste ke WhatsApp.");
    }

    function downloadPDF() {
        const element = document.getElementById('reportToPrint');
        const opt = { margin: 10, filename: `Laporan_SlayBank_${db.targetLabel}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, backgroundColor: '#000000' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save();
    }

    function resetAll() { if(confirm("Hapus semua?")) { localStorage.clear(); location.reload(); } }
    sync();
</script>
</body>
</html>
